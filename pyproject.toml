[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sweep-audit"
version = "0.2.0"
description = "Audit which declared CLI/config knobs were actually exercised, and check whether the resulting gains are real, material, and shippable."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "sweep-audit contributors"}]
keywords = ["hyperparameter", "experiment-tracking", "reproducibility", "argparse", "audit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
sweep-audit = "sweep_audit:main"
sweep-verdict = "verdict:main"

[tool.setuptools]
py-modules = ["sweep_audit", "audit_flags", "verdict"]
